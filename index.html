<link rel="stylesheet" href="style.css">
</head><body><div id="app"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signInWithPopup,GoogleAuthProvider,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,updateDoc,addDoc,collection,query,where,orderBy,onSnapshot,serverTimestamp,arrayUnion,arrayRemove}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const fb=initializeApp({apiKey:"AIzaSyDsTgset1Zu8QKlqnRiJHQ8NPqofKSaZ-4",authDomain:"nonichat.firebaseapp.com",projectId:"nonichat",storageBucket:"nonichat.firebasestorage.app",messagingSenderId:"232368456089",appId:"1:232368456089:web:6bb1b70b18740cc0e01308"});
const auth=getAuth(fb),db=getFirestore(fb);
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mail=u=>u.toLowerCase()+'@nonichat.app',okName=u=>/^[a-z0-9_]{3,20}$/i.test(u);
const lg=k=>{try{return localStorage.getItem(k)}catch(e){}},ls=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const ACC=['#7c3aed','#3b82f6','#ec4899','#f97316','#22c55e','#06b6d4'];
const WP=['linear-gradient(160deg,#2b1a6e,#6d28d9,#1e1b4b)','linear-gradient(160deg,#f9a8d4,#c4b5fd,#a5f3fc)','linear-gradient(160deg,#7dd3fc,#a78bfa)','linear-gradient(160deg,#fde68a,#fb7185,#818cf8)'];
const BUB=['rgba(124,58,237,.4)','var(--ac)','#3b82f6','linear-gradient(135deg,#7c3aed,#4f46e5)'];
function prefs(){const r=document.documentElement,t=lg('nc_theme')||'auto',w=lg('nc_wp');
 r.dataset.theme=t=='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):t;
 r.dataset.glass=lg('nc_glass')||'on';
 r.style.setProperty('--ac',lg('nc_ac')||ACC[0]);
 r.style.setProperty('--wp',w==null?'linear-gradient(160deg,rgba(124,92,240,.5),rgba(91,141,239,.3))':WP[w]);
 r.style.setProperty('--me',BUB[lg('nc_bub')||3]);
 r.style.fontSize=(lg('nc_fs')||'16')+'px'}
prefs();
const colors=['#ff9500','#ff2d55','#5856d6','#34c759','#af52de','#00b0c8','#ff3b30'];
const av=(n,z,p)=>{const sz=z?`;width:${z}px;height:${z}px;font-size:${Math.round(z*.42)}px`:'';return p?`<div class="av" style="background:url(${p}) center/cover${sz}"></div>`:`<div class="av" style="background:${colors[(n||'?').charCodeAt(0)%colors.length]}${sz}">${esc((n||'?')[0].toUpperCase())}</div>`};
const tm=d=>d?new Date(d).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'';
const oth=c=>c.members.find(x=>x!==me.uid);
let me=null,busy=false,mode='login',tab='chats',chats=[],unC,unM,openId=null;const pc={};
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2200)}
function msg(e){const c=e.code||'';return({'auth/email-already-in-use':'This username is already taken','auth/invalid-credential':'Wrong username or password','auth/weak-password':'Password must be at least 6 characters','auth/network-request-failed':'Check your internet connection','auth/popup-closed-by-user':'Sign-in cancelled','auth/unauthorized-domain':'Add this site to Authorized domains in Firebase','auth/operation-not-allowed':'Enable this sign-in method in Firebase',taken:'This username is already taken'})[c]||(e.message||'Something went wrong')}
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.08;o.start();o.stop(c.currentTime+.15)}catch(e){}}

/* ---------- LOGIN ---------- */
function viewAuth(){
 app.innerHTML=`<div class="center"><div class="big">N</div><h1 class="logo" style="text-align:center;font-size:38px">NoniChat</h1><p style="text-align:center;margin:0;color:var(--sub)">Connect • Chat • Share</p>
 <div class="seg gl"><button id="t1" class="${mode=='login'?'on':''}">Log in</button><button id="t2" class="${mode=='signup'?'on':''}">Sign up</button></div>
 <input id="u" placeholder="Username" autocapitalize="none" autocomplete="username"><input id="p" type="password" placeholder="Password" autocomplete="current-password">
 <div class="err" id="er"></div><button class="btn" id="go">${mode=='login'?'Log in':'Create account'}</button>
 <button class="btn g" id="gg">Continue with Google</button></div>`;
 $('#t1').onclick=()=>{mode='login';viewAuth()};$('#t2').onclick=()=>{mode='signup';viewAuth()};
 const er=t=>$('#er').textContent=t;
 $('#go').onclick=async()=>{const u=$('#u').value.trim(),p=$('#p').value;
  if(!okName(u))return er('Username: 3-20 characters, a-z, 0-9 and _ only');
  if(p.length<6)return er('Password must be at least 6 characters');
  er('');
  try{
   if(mode=='login')await signInWithEmailAndPassword(auth,mail(u),p);
   else{busy=true;const c=await createUserWithEmailAndPassword(auth,mail(u),p);await claim(c.user,u.toLowerCase(),u);busy=false;init(auth.currentUser)}
  }catch(e){busy=false;er(msg(e));if(auth.currentUser&&mode=='signup')init(auth.currentUser)}};
 $('#gg').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){er(msg(e))}};
}
async function claim(user,uname,name){
 const r=doc(db,'usernames',uname);
 if((await getDoc(r)).exists())throw{code:'taken'};
 await setDoc(r,{uid:user.uid});
 await setDoc(doc(db,'users',user.uid),{username:uname,name,bio:''});
}
function viewClaim(u){
 app.innerHTML=`<div class="center"><div class="big">N</div><h2 style="text-align:center;margin:0">Choose your username</h2>
 <input id="u" placeholder="Username (a-z, 0-9, _)" autocapitalize="none"><div class="err" id="er"></div>
 <button class="btn" id="go">Continue</button><button id="lo">Log out</button></div>`;
 $('#lo').onclick=()=>signOut(auth);
 $('#go').onclick=async()=>{const n=$('#u').value.trim();if(!okName(n))return $('#er').textContent='Username: 3-20 characters, a-z, 0-9 and _ only';
  try{await claim(u,n.toLowerCase(),u.displayName||n);init(u)}catch(e){$('#er').textContent=msg(e)}};
}
async function init(u){
 if(!u)return viewAuth();
 const s=await getDoc(doc(db,'users',u.uid));
 if(!s.exists())return viewClaim(u);
 me={uid:u.uid,...s.data()};
 unC&&unC();
 unC=onSnapshot(query(collection(db,'chats'),where('members','array-contains',me.uid)),sn=>{
  sn.docChanges().forEach(ch=>{if(ch.type!='modified')return;const d=ch.doc.data(),o=d.members.find(x=>x!==me.uid);if(d.lastFrom&&d.lastFrom!=me.uid&&!(me.blocked||[]).includes(o)&&(openId!=ch.doc.id||document.hidden)&&lg('nc_snd')!='0')beep()});
  chats=sn.docs.map(d=>({id:d.id,...d.data()})).filter(c=>c.lastAt&&!(me.blocked||[]).includes(oth(c))).sort((a,b)=>b.lastAt-a.lastAt);
  if(!openId&&$('#list'))rl();
 },e=>console.log(e));
 viewMain();
}
onAuthStateChanged(auth,u=>{if(busy)return;if(!u){unC&&unC();me=null;return viewAuth()}init(u)});

/* ---------- MAIN + TABS ---------- */
function sub(t,h,bk){app.innerHTML=`<div class="hdr gl"><button id="bk">‹</button><span class="ttl">${t}</span></div><div class="scroll">${h}</div>`;$('#bk').onclick=bk||vSet}
function viewMain(){
 openId=null;unM&&unM();
 const T=[['chats','💬','Chats'],['calls','📞','Calls'],['x'],['exp','🧭','Explore'],['me','👤','Profile']];
 app.innerHTML=`<div id="body"></div><nav class="tabs gl">${T.map(([k,i,l])=>k=='x'?`<button class="plus" id="nw">+</button>`:`<button data-k="${k}" class="${tab==k?'on':''}"><b>${i}</b><span>${l}</span></button>`).join('')}</nav>`;
 $('#nw').onclick=viewNew;
 app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{tab=b.dataset.k;viewMain()});
 ({chats:vChats,calls:vCalls,exp:vExp,me:vMe})[tab]();
}
function vChats(){
 $('#body').innerHTML=`<div class="top"><h1 class="logo">NoniChat</h1><button class="ib gl" id="st">⚙️</button></div><div class="pad"><input id="sq" class="gl" placeholder="🔍 Search chats..."></div>
 <div class="stories"><div class="story" id="ad"><div class="av add" style="width:56px;height:56px">+</div>Add Story</div>${chats.slice(0,6).map(c=>{const o=oth(c),n=(c.names||{})[o]||'User';return`<div class="story">${av(n,56,pc[o])}${esc(n.split(' ')[0])}</div>`}).join('')}</div>
 <div class="scroll" id="list"></div>`;
 $('#st').onclick=vSet;$('#sq').oninput=rl;$('#ad').onclick=()=>toast('Stories coming soon');rl();
}
function rl(){
 const l=$('#list');if(!l)return;
 const q=($('#sq')?.value||'').toLowerCase().trim();
 const cs=chats.filter(c=>((c.names||{})[oth(c)]||'').toLowerCase().includes(q));
 const miss=[...new Set(cs.map(oth))].filter(o=>!(o in pc));if(miss.length){miss.forEach(o=>pc[o]=null);Promise.all(miss.map(async o=>{const x=await getDoc(doc(db,'users',o));pc[o]=x.data()?.photo||null})).then(rl)}
 if(!cs.length){l.innerHTML=`<div class="empty">${chats.length?'No results.':'No chats yet.<br>Tap + to start a chat with a username.'}</div>`;return}
 l.innerHTML=cs.map(c=>{const o=oth(c),n=(c.names||{})[o]||'User';
  return`<div class="row" data-o="${o}">${av(n,0,pc[o])}<div class="rb"><div class="rn"><span>${esc(n)}</span><small>${tm(c.lastAt)}</small></div><div class="rl">${esc(c.last)}</div></div></div>`}).join('');
 l.querySelectorAll('.row').forEach(r=>r.onclick=async()=>{const s=await getDoc(doc(db,'users',r.dataset.o));openChat({uid:r.dataset.o,...s.data()})});
}
function vCalls(){$('#body').innerHTML=`<div class="top"><h1>Calls</h1></div><div class="empty">📞<br>Voice and video calls are coming soon.</div>`}
const CH=[['Noni Official','1.5M','🟣'],['Tech World','842K','🎮'],['Gaming Hub','1.2M','🕹️'],['Lifestyle Tips','638K','✨'],['Movie Updates','1.1M','🎬'],['Travel Diaries','520K','✈️'],['Education Zone','790K','📚']];
const joined=new Set();
function vExp(){
 $('#body').innerHTML=`<div class="top"><h1>Channels</h1><button class="ib gl" id="vr">📢</button></div><div class="pad"><input class="gl" placeholder="🔍 Search channels..."></div>
 <div class="pills"><button class="on">All</button><button>Popular</button><button>Tech</button><button>Sports</button></div>
 <div class="scroll"><div class="card gl">${CH.map((c,i)=>`<div><span style="display:flex;gap:12px;align-items:center"><span class="av" style="background:var(--ac)">${c[2]}</span><span><b>${c[0]}</b><br><small style="color:var(--sub)">${c[1]} subscribers</small></span></span><button class="join" data-i="${i}">${joined.has(i)?'Joined':'Join'}</button></div>`).join('')}</div></div>`;
 $('#vr').onclick=vRooms;
 app.querySelectorAll('.join').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;joined.has(i)?joined.delete(i):joined.add(i);b.textContent=joined.has(i)?'Joined':'Join'});
}
function vMe(){
 const R=(k,i,t)=>`<div class="srow" data-a="${k}"><i>${i}</i><b>${t}</b><span>›</span></div>`;
 $('#body').innerHTML=`<div class="top"><span></span><button class="ib gl" id="ed">✏️</button></div><div class="scroll"><div style="text-align:center;padding:0 10px 6px"><div class="crownw"><span class="crown">👑</span>${av(me.name,120,me.photo)}</div><h2 style="margin:10px 0 0">${esc(me.name)} 💜</h2><div style="color:var(--sub)">@${esc(me.username)} <span style="color:#3b82f6">✔</span></div><div class="online">● Online</div><p style="color:var(--sub);margin:6px 0">${esc(me.bio||'Just here to chat &amp; chill')} 💗</p></div>
 <div class="stat"><div><b>0</b><small>Followers</small></div><div><b>${(me.contacts||[]).length}</b><small>Following</small></div><div><b>0</b><small>Likes</small></div></div>
 <div class="pad"><button class="btn g gl" id="ed2">Edit Profile</button></div>
 <div class="wal"><div class="gl"><span>🪙</span><small>My Wallet</small><b>0</b></div><div class="gl"><span>⭐</span><small>My Stars</small><b>0</b></div></div>
 <div class="card gl">${R('saved','🔖','Saved Messages')}${R('exp','📢','My Channels')}${R('pri','🔒','Privacy &amp; Security')}${R('set','⚙️','Settings')}${R('hlp','❓','Help &amp; Support')}${R('studio','🎨','Chat Studio')}${R('rooms','🎙️','Voice Rooms')}${R('prem','👑','NoniChat Premium')}</div></div>`;
 $('#ed').onclick=$('#ed2').onclick=vAcc;
 app.querySelectorAll('[data-a]').forEach(r=>r.onclick=()=>({saved:()=>toast('Saved Messages coming soon'),exp:()=>{tab='exp';viewMain()},pri:vPri,hlp:vHelp,rooms:vRooms,studio:vStudio,prem:vPrem,set:vSet})[r.dataset.a]());
}

/* ---------- SETTINGS ---------- */
function vSet(){
 const R=(k,i,t,x)=>`<div class="srow" data-a="${k}"><i>${i}</i><b>${t}</b><small>${x||''}</small><span>›</span></div>`;
 sub('Settings',`<div class="card gl"><div style="gap:14px;justify-content:flex-start">${av(me.name,56,me.photo)}<div><b>${esc(me.name)}</b><br><small style="color:var(--sub)">@${esc(me.username)}</small></div></div></div>
 <div class="card gl">${R('acc','👤','Account')}${R('app','🌗','Appearance','Dark &amp; Light')}${R('not','🔔','Notifications')}${R('pri','🔒','Privacy &amp; Security')}${R('dat','💾','Data &amp; Storage')}${R('lan','🌐','Language','English')}${R('hlp','❓','Help &amp; Support')}${R('abt','ℹ️','About NoniChat')}</div>
 <div class="card gl"><div><button id="lo" style="width:100%;color:#ff3b30;font-weight:700">Log Out</button></div></div>`,viewMain);
 $('#lo').onclick=()=>signOut(auth);
 app.querySelectorAll('[data-a]').forEach(r=>r.onclick=()=>({acc:vAcc,app:vApp,not:vNot,pri:vPri,dat:vDat,lan:()=>toast('More languages coming soon'),hlp:vHelp,abt:()=>toast('NoniChat v3 — Be Social. Be You.')})[r.dataset.a]());
}
function vAcc(){
 sub('Account',`<div style="text-align:center;padding:14px 0"><div style="display:flex;justify-content:center">${av(me.name,96,me.photo)}</div><button id="cp" style="margin-top:8px">Change photo</button></div><div class="card gl"><div><span>Name</span><input id="nm" value="${esc(me.name)}" style="width:60%;text-align:right"></div><div><span>Username</span><span style="color:var(--sub)">@${esc(me.username)}</span></div><div><span>Bio</span><input id="bo" value="${esc(me.bio)}" placeholder="Write something" style="width:60%;text-align:right"></div></div><div style="padding:0 16px"><button class="btn" id="sv">Save changes</button></div>`);
 $('#cp').onclick=()=>pickPhoto(async d=>{try{await updateDoc(doc(db,'users',me.uid),{photo:d});me.photo=d;toast('Photo updated');vAcc()}catch(e){toast('Could not save photo')}});
 $('#sv').onclick=async()=>{const n=$('#nm').value.trim()||me.name,b=$('#bo').value.trim();try{await updateDoc(doc(db,'users',me.uid),{name:n,bio:b});me.name=n;me.bio=b;toast('Saved');viewMain()}catch(e){toast('Could not save')}};
}
function pickPhoto(cb){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files[0];if(!f)return;const im=new Image();im.onload=()=>{const z=256,c=document.createElement('canvas');c.width=c.height=z;const m=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,z,z);cb(c.toDataURL('image/jpeg',.8))};im.src=URL.createObjectURL(f)};i.click()}
const dots=(cur,k)=>`<div class="dots">${ACC.map((c,i)=>`<button class="dot ${cur==c?'on':''}" data-c="${c}" style="background:${c}"></button>`).join('')}</div>`;
function vApp(){
 const th=lg('nc_theme')||'auto',g=lg('nc_glass')!='off',ac=lg('nc_ac')||ACC[0];
 sub('Appearance',`<div class="card gl"><div><b>Theme Mode</b></div><div><div class="seg gl">${['auto','light','dark'].map(x=>`<button data-t="${x}" class="${th==x?'on':''}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div></div></div>
 <div class="card gl"><div><span>Glass Effect</span><input type="checkbox" id="gz" ${g?'checked':''} style="width:24px;height:24px"></div></div>
 <div class="card gl"><div style="display:block"><b>Accent Color</b>${dots(ac)}</div></div>
 <div class="card gl"><div style="display:block"><b>Chat Bubble Preview</b><div class="m me" style="margin-top:10px;display:inline-block">This is a preview bubble 💜<small>9:41 PM</small></div></div></div>
 <div class="card gl"><div><span>Font Size</span><input id="fs" type="range" min="14" max="22" value="${lg('nc_fs')||16}" style="width:60%;padding:0"></div></div>
 <div style="padding:0 16px"><button class="btn g" id="rs">Reset to Default</button></div>`);
 app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ls('nc_theme',b.dataset.t);prefs();vApp()});
 app.querySelectorAll('.dot').forEach(b=>b.onclick=()=>{ls('nc_ac',b.dataset.c);prefs();vApp()});
 $('#gz').onchange=e=>{ls('nc_glass',e.target.checked?'on':'off');prefs()};
 $('#fs').oninput=e=>{ls('nc_fs',e.target.value);prefs()};
 $('#rs').onclick=()=>{['nc_theme','nc_glass','nc_ac','nc_fs','nc_wp','nc_bub'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});prefs();toast('Reset done');vApp()};
}
function vStudio(){
 const w=lg('nc_wp'),b=lg('nc_bub')||3,ac=lg('nc_ac')||ACC[0];
 sub('Chat Studio',`<div class="card gl"><div><b>Wallpaper</b></div></div><div class="wps">${WP.map((x,i)=>`<button class="wp ${w==i?'on':''}" data-w="${i}" style="background:${x}"></button>`).join('')}</div>
 <div class="card gl"><div><b>Bubble Style</b></div></div><div class="wps">${BUB.map((x,i)=>`<button class="wp ${b==i?'on':''}" data-b="${i}" style="height:60px;background:${x.replace('var(--ac)',ac)}"></button>`).join('')}</div>
 <div class="card gl"><div style="display:block"><b>Accent Color</b>${dots(ac)}</div></div>
 <div style="padding:0 16px"><button class="btn" id="ap">Apply Theme</button></div>`,vMe);
 app.querySelectorAll('[data-w]').forEach(x=>x.onclick=()=>{ls('nc_wp',x.dataset.w);prefs();vStudio()});
 app.querySelectorAll('[data-b]').forEach(x=>x.onclick=()=>{ls('nc_bub',x.dataset.b);prefs();vStudio()});
 app.querySelectorAll('.dot').forEach(x=>x.onclick=()=>{ls('nc_ac',x.dataset.c);prefs();vStudio()});
 $('#ap').onclick=()=>{toast('Theme applied');viewMain()};
}
function vNot(){sub('Notifications',`<div class="card gl"><div><span>Message sound</span><input type="checkbox" id="s1" ${lg('nc_snd')!='0'?'checked':''} style="width:24px;height:24px"></div></div>`);$('#s1').onchange=e=>ls('nc_snd',e.target.checked?'1':'0')}
function vPri(){
 sub('Privacy &amp; Security',`<div style="padding:16px"><input id="q" placeholder="Username to block" autocapitalize="none"><div class="err" id="er"></div><button class="btn" id="fd">Block user</button></div><div id="bk2"></div>`);
 const draw=async()=>{const us=await Promise.all((me.blocked||[]).map(async i=>{const x=await getDoc(doc(db,'users',i));return{uid:i,...(x.data()||{name:'User',username:'?'})}}));const box=$('#bk2');if(!box)return;
  box.innerHTML=us.map(u=>`<div class="row"><div class="rb">${esc(u.name)} <small>@${esc(u.username)}</small></div><button data-u="${u.uid}" style="color:#ff3b30">Unblock</button></div>`).join('')||'<div class="empty">No blocked users</div>';
  box.querySelectorAll('button').forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,'users',me.uid),{blocked:arrayRemove(b.dataset.u)});me.blocked=me.blocked.filter(x=>x!=b.dataset.u);draw()})};
 $('#fd').onclick=async()=>{const n=$('#q').value.trim().toLowerCase();if(!n)return;
  try{const r=await getDoc(doc(db,'usernames',n));if(!r.exists())return $('#er').textContent='No user found';const uid=r.data().uid;if(uid==me.uid)return $('#er').textContent='You cannot block yourself';
   await updateDoc(doc(db,'users',me.uid),{blocked:arrayUnion(uid)});me.blocked=[...new Set([...(me.blocked||[]),uid])];$('#er').textContent='';draw()}catch(e){$('#er').textContent=msg(e)}};
 draw();
}
function vDat(){sub('Data &amp; Storage',`<div class="card gl"><div><span>Chats</span><span>${chats.length}</span></div></div><div class="empty">Messages are stored in the cloud, so they do not use your phone storage.</div>`)}
function vHelp(){const q=[['How do I start a chat?','Tap +, enter your friend\'s username and tap Find.'],['How do I change the theme?','Settings → Appearance, or Profile → Chat Studio.'],['I forgot my password','Use Google login or create a new account.']];
 sub('Help &amp; Support',`<div class="card gl">${q.map(x=>`<div style="display:block"><b>${x[0]}</b><div style="color:var(--sub);margin-top:4px">${x[1]}</div></div>`).join('')}</div>`)}

/* ---------- NEW CHAT + CHAT ---------- */
function viewNew(){
 app.innerHTML=`<div class="hdr gl"><button id="bk">‹</button><span class="ttl">New chat</span></div><div style="padding:16px"><input id="q" placeholder="Enter username" autocapitalize="none"><div class="err" id="er" style="margin:10px 0"></div><button class="btn" id="fd">Find</button></div>`;
 $('#bk').onclick=viewMain;
 $('#fd').onclick=async()=>{const n=$('#q').value.trim().toLowerCase();if(!n)return;
  try{const r=await getDoc(doc(db,'usernames',n));if(!r.exists())return $('#er').textContent='No user found';
   const uid=r.data().uid;if(uid==me.uid)return $('#er').textContent='This is you 🙂';
   const s=await getDoc(doc(db,'users',uid));openChat({uid,...s.data()})}catch(e){$('#er').textContent=msg(e)}};
}
async function openChat(o){if((me.blocked||[]).includes(o.uid))return toast('Unblock this user first');
 const id=[me.uid,o.uid].sort().join('_');openId=id;
 await setDoc(doc(db,'chats',id),{members:[me.uid,o.uid],names:{[me.uid]:me.name,[o.uid]:o.name}},{merge:true});
 app.innerHTML=`<div class="hdr gl"><button id="bk">‹</button>${av(o.name,0,o.photo)}<div class="ttl">${esc(o.name)}<br><small style="color:var(--sub);font-weight:400">Online</small></div><button class="ib" id="c1">📞</button><button class="ib" id="c2">📹</button></div>
 <div class="msgs" id="ms"></div>
 <div class="att gl" id="att" hidden><button data-k="img">🖼️<span>Photo</span></button><button data-k="aud">🎵<span>Audio</span></button><button data-k="file">📄<span>File</span></button></div>
 <div class="comp gl"><button id="pl">📎</button><input id="tx" placeholder="Type a message..." autocomplete="off"><button id="mic">🎤</button><button class="send" id="sd">➤</button></div>`;
 $('#bk').onclick=viewMain;$('#c1').onclick=$('#c2').onclick=()=>toast('Calls coming soon');
 unM&&unM();
 const ok=d=>typeof d=='string'&&d.startsWith('data:');
 const body=m=>!ok(m.data)?esc(m.text):m.type=='image'?`<img class="mi" src="${m.data}">`:m.type=='audio'?`<audio controls src="${m.data}"></audio>${m.name?'<br>'+esc(m.name):''}`:`<a class="mf" href="${m.data}" download="${esc(m.name||'file')}">📄 ${esc(m.name||'file')}</a>`;
 unM=onSnapshot(query(collection(db,'chats',id,'messages'),orderBy('at')),sn=>{
  const ms=$('#ms');if(!ms)return;
  ms.innerHTML=sn.docs.map(d=>{const m=d.data(),mine=m.from==me.uid;return`<div class="m ${mine?'me':'you'}">${body(m)}<small>${tm(m.at?.toMillis?.()||Date.now())}${mine?' ✓✓':''}</small></div>`}).join('');
  ms.scrollTop=ms.scrollHeight;
 },e=>console.log(e));
 const send=async(m,prev)=>{try{await addDoc(collection(db,'chats',id,'messages'),{from:me.uid,at:serverTimestamp(),...m});await setDoc(doc(db,'chats',id),{last:prev||m.text,lastAt:Date.now(),lastFrom:me.uid},{merge:true})}catch(e){toast('Message not sent');console.log(e)}};
 const sendTx=()=>{const i=$('#tx'),t=i.value.trim();if(!t)return;i.value='';send({text:t})};
 const rd=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
 const pick=(acc,cb)=>{const i=document.createElement('input');i.type='file';i.accept=acc;i.onchange=()=>i.files[0]&&cb(i.files[0]);i.click()};
 const big=async(f,t)=>{if(f.size>650000)return toast('File too big (max 650 KB for now)');send({type:t,data:await rd(f),name:f.name,text:''},(t=='audio'?'🎵 ':'📄 ')+f.name)};
 $('#pl').onclick=()=>{$('#att').hidden=!$('#att').hidden};
 $('#att').onclick=e=>{const k=e.target.closest('button')?.dataset.k;if(!k)return;$('#att').hidden=true;
  if(k=='img')pick('image/*',f=>{const im=new Image();im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);send({type:'image',data:c.toDataURL('image/jpeg',.7),text:''},'📷 Photo')};im.src=URL.createObjectURL(f)});
  else if(k=='aud')pick('audio/*',f=>big(f,'audio'));
  else pick('*/*',f=>big(f,'file'))};
 let rec=null,chunks=[],tt;
 $('#mic').onclick=async()=>{
  if(rec){rec.stop();return}
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true});
   rec=new MediaRecorder(st,{audioBitsPerSecond:24000});chunks=[];
   rec.ondataavailable=e=>chunks.push(e.data);
   rec.onstop=async()=>{st.getTracks().forEach(t=>t.stop());clearTimeout(tt);const mc=$('#mic');if(mc)mc.textContent='🎤';const b=new Blob(chunks,{type:rec.mimeType});rec=null;if(b.size>650000)return toast('Voice message too long');send({type:'audio',data:await rd(b),text:''},'🎤 Voice message')};
   rec.start();$('#mic').textContent='⏹️';tt=setTimeout(()=>rec&&rec.stop(),60000);
  }catch(e){toast('Microphone permission needed')}};
 $('#sd').onclick=sendTx;$('#tx').onkeydown=e=>{if(e.key=='Enter')sendTx()};
}
</script></body></html>
